<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin:0; padding:0; background:#f3f4f6; font-family:Arial, sans-serif; color:#111827; }
    .wrap { max-width:760px; margin:0 auto; padding:28px 16px; }
    .card { background:#ffffff; border-radius:18px; padding:28px; border:1px solid #e5e7eb; }
    .kicker { color:#6d28d9; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    h1 { margin:8px 0 6px; font-size:28px; line-height:1.15; }
    .date { color:#6b7280; margin-bottom:24px; }
    h2 { font-size:18px; margin:24px 0 10px; }
    ul { margin:0; padding-left:20px; }
    li { margin:8px 0; line-height:1.45; }
    .box { background:#f9fafb; border:1px solid #e5e7eb; border-radius:14px; padding:14px 16px; line-height:1.55; }
    .footer { color:#6b7280; font-size:12px; margin-top:22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="kicker">Scribe IA Direction</div>
      <h1>Récap Direction — {{date}}</h1>
      <div class="date">Allan & Alphim</div>

      {{content_html}}

      <div class="footer">Mail généré automatiquement depuis les vocaux et notes de la journée.</div>
    </div>
  </div>
</body>
</html>
